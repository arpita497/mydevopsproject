apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
      - name: flask
        image: 843730870812.dkr.ecr.ap-south-1.amazonaws.com/my-ecr-repo
        ports:
        - containerPort: 8000

